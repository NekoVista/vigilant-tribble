<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — EmuioHost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <style>
    .dashboard {
      padding: 100px 0 60px;
      min-height: 100vh;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .dashboard-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .dashboard-header p {
      color: var(--text-muted);
      margin-top: 4px;
    }
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .site-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: border-color 0.2s;
    }
    .site-card:hover {
      border-color: rgba(0, 212, 170, 0.4);
    }
    .site-card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }
    .site-url {
      color: var(--primary);
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: block;
    }
    .site-meta {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .site-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .site-status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #28c840;
      border-radius: 50%;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .empty-state h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .empty-state p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .deploy-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 40px;
    }
    .deploy-form h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }
    .deploy-form .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .deploy-form input {
      flex: 1;
      min-width: 200px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .deploy-form input:focus {
      border-color: var(--primary);
    }
    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">Checking authentication…</div>

  <div id="app" style="display:none;">
    <nav class="navbar scrolled">
      <div class="container nav-container">
        <a href="index.html" class="logo">
          <span class="logo-icon">◈</span>
          EmuioHost
        </a>
        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <div class="mobile-nav-actions"></div>
        </div>
        <div class="nav-actions"></div>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <main class="dashboard">
      <div class="container">
        <div class="dashboard-header">
          <div>
            <h1>Your sites</h1>
            <p id="welcomeText">Loading...</p>
          </div>
          <button class="btn btn-primary" onclick="document.getElementById('siteName').focus()">
            + New site
          </button>
        </div>

        <div class="deploy-form">
          <h2>Deploy a new site</h2>
          <form id="deployForm" onsubmit="addSite(event)">
            <div class="form-row">
              <input type="text" id="siteName" placeholder="Site name (e.g. my-portfolio)" required>
              <input type="url" id="repoInput" placeholder="GitHub repo URL (optional)">
              <button type="submit" class="btn btn-primary">Deploy</button>
            </div>
          </form>
        </div>

        <div id="sitesContainer">
          <div class="empty-state" id="emptyState">
            <h2>No sites yet</h2>
            <p>Deploy your first site above. It only takes a few seconds.</p>
          </div>
          <div class="sites-grid" id="sitesGrid" style="display:none;"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="script.js"></script>
  <script>
    let currentUser = null;

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('welcomeText').textContent = 'Signed in as ' + user.email;
      renderSites();
    });

    function getSitesKey() {
      return 'emuio_sites_' + (currentUser ? currentUser.uid : 'anon');
    }

    function getSites() {
      try {
        return JSON.parse(localStorage.getItem(getSitesKey())) || [];
      } catch {
        return [];
      }
    }

    function saveSites(sites) {
      localStorage.setItem(getSitesKey(), JSON.stringify(sites));
    }

    function renderSites() {
      const sites = getSites();
      const grid = document.getElementById('sitesGrid');
      const empty = document.getElementById('emptyState');

      if (sites.length === 0) {
        empty.style.display = 'block';
        grid.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = sites.map(site => `
        <div class="site-card">
          <h3>${site.name}</h3>
          <a class="site-url" href="https://${site.slug}.emuio.app" target="_blank" rel="noopener">
            ${site.slug}.emuio.app
          </a>
          <div class="site-meta">
            <span class="site-status">Live</span>
            <span>Deployed ${new Date(site.createdAt).toLocaleDateString()}</span>
          </div>
        </div>
      `).join('');
    }

    function addSite(e) {
      e.preventDefault();
      const name = document.getElementById('siteName').value.trim();
      if (!name) return;

      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const sites = getSites();

      if (sites.some(s => s.slug === slug)) {
        showToast('A site with that name already exists', 'error');
        return;
      }

      sites.unshift({
        name,
        slug,
        repo: document.getElementById('repoInput').value.trim() || null,
        createdAt: new Date().toISOString()
      });
      saveSites(sites);
      document.getElementById('deployForm').reset();
      renderSites();
      showToast('Site deployed! ' + slug + '.emuio.app is live.');
    }
  </script>
</body>
</html>
